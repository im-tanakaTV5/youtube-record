<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTubeの許可｜YouTube記録</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; line-height: 1.9; color: #222; background: #fff; }
  h1 { font-size: 22px; }
  .btn { display: inline-block; background: #1a73e8; color: #fff; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-size: 16px; }
  .note { color: #555; font-size: 14px; }
</style>
</head>
<body>
<h1>YouTubeの許可</h1>
<div id="main">
<p>YouTubeチャンネルの数字を読み取る許可をお願いします。</p>
<p>次の画面で、<b>記録したいチャンネルの名前</b>を選んでください（ご自分の名前のアカウントではなく、チャンネル名が表示されている方です）。</p>
<p><a class="btn" id="go" href="#">Googleで許可する</a></p>
<p class="note">「このアプリは Google で確認されていません」と出たら、「詳細」→「（安全ではないページ）に移動」で進めてください。読み取りだけの許可で、チャンネルへの書き込みや投稿はしません。<a href="privacy.html">プライバシーポリシー</a></p>
</div>
<script>
  var key = new URLSearchParams(location.search).get('key') || '';
  if (!/^ytk-[0-9a-f]{20}$/.test(key)) {
    document.getElementById('main').innerHTML = '<p>このリンクは使えません。スプレッドシートのメニューから「はじめる」を押し直してください。</p>';
  } else {
    var q = new URLSearchParams({
      client_id: '1057104978238-h6fegvq0lan96r5200fri7lu6hsnke9b.apps.googleusercontent.com',
      redirect_uri: 'https://im-tanakatv5.github.io/youtube-record/callback.html',
      response_type: 'code',
      scope: 'https://www.googleapis.com/auth/youtube.readonly https://www.googleapis.com/auth/yt-analytics.readonly https://www.googleapis.com/auth/yt-analytics-monetary.readonly',
      access_type: 'offline',
      prompt: 'consent select_account',
      state: key
    });
    document.getElementById('go').href = 'https://accounts.google.com/o/oauth2/v2/auth?' + q.toString();
  }
</script>
</body>
</html>
