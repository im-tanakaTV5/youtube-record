<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTubeの許可｜YouTube記録</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; line-height: 1.9; color: #222; background: #fff; }
  h1 { font-size: 22px; }
  .btn { display: inline-block; background: #1a73e8; color: #fff; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-size: 16px; }
  .note { color: #555; font-size: 14px; }
</style>
</head>
<body>
<h1>YouTubeの許可</h1>
<p id="msg">許可を受け取っています。このままお待ちください…</p>
<script>
  var p = new URLSearchParams(location.search);
  var msg = document.getElementById('msg');
  history.replaceState(null, '', location.pathname);
  function show(text) { msg.textContent = text; }
  if (p.get('error') || !p.get('code')) {
    show('許可されませんでした。もう一度スプレッドシートのメニューから「はじめる」を押してください。');
  } else {
    var url = 'https://script.google.com/macros/s/AKfycbwQY7jCnHLJxWXFYtVxx8_DqrKZT-c7tAriPBzJBoPLDC5gGSmx2KHVmqPcBuFqFJ_a/exec?action=exchange'
      + '&state=' + encodeURIComponent(p.get('state') || '') + '&code=' + encodeURIComponent(p.get('code'));
    fetch(url, { credentials: 'omit' }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.ok) show('「' + j.title + '」の許可を受け取りました。このタブを閉じて、スプレッドシートのメニューから「YouTube記録」→「今すぐ取り込む」を押してください。');
      else show(j.message || '許可の受け取りに失敗しました。もう一度「はじめる」を押してください。');
    }).catch(function () {
      show('許可の受け取りに失敗しました。少し待ってから、もう一度スプレッドシートのメニューの「はじめる」を押してください。');
    });
  }
</script>
</body>
</html>
