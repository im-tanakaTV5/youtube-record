<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTubeの許可｜YouTube記録</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; line-height: 1.9; color: #222; background: #fff; }
  h1 { font-size: 22px; }
  .btn { display: inline-block; background: #1a73e8; color: #fff; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-size: 16px; }
  input { width: 100%; box-sizing: border-box; font-size: 15px; padding: 10px; border: 1px solid #bbb; border-radius: 6px; }
  button.btn { border: 0; cursor: pointer; }
  ol li { margin-bottom: 8px; }
  .note { color: #555; font-size: 14px; }
</style>
</head>
<body>
<h1>YouTubeの許可</h1>
<div id="main"><p>許可を受け取っています。このままお待ちください…</p></div>
<script>
  var p = new URLSearchParams(location.search);
  var main = document.getElementById('main');
  var key = p.get('state') || '';
  history.replaceState(null, '', location.pathname);
  function say(text) { main.innerHTML = ''; var el = document.createElement('p'); el.textContent = text; main.appendChild(el); }
  if (p.get('error') || !p.get('code')) {
    say('許可されませんでした。もう一度、受け取ったリンクから始めてください。');
  } else {
    fetch('https://script.google.com/macros/s/AKfycbwQY7jCnHLJxWXFYtVxx8_DqrKZT-c7tAriPBzJBoPLDC5gGSmx2KHVmqPcBuFqFJ_a/exec?action=exchange&state=' + encodeURIComponent(key) + '&code=' + encodeURIComponent(p.get('code')), { credentials: 'omit' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) return say(j.message || '許可の受け取りに失敗しました。もう一度、受け取ったリンクから始めてください。');
        say('「' + j.title + '」の許可を受け取りました。');
        var a = document.createElement('a');
        a.className = 'btn';
        a.href = 'sheet.html?key=' + encodeURIComponent(key);
        a.textContent = '次へ（スプレッドシートの登録）';
        var wrap = document.createElement('p');
        wrap.appendChild(a);
        main.appendChild(wrap);
      })
      .catch(function () { say('許可の受け取りに失敗しました。少し待ってから、もう一度、受け取ったリンクから始めてください。'); });
  }
</script>
</body>
</html>
