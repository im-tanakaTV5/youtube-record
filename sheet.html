<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スプレッドシートの登録｜YouTube記録</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; line-height: 1.9; color: #222; background: #fff; }
  h1 { font-size: 22px; }
  .btn { display: inline-block; background: #1a73e8; color: #fff; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-size: 16px; }
  input { width: 100%; box-sizing: border-box; font-size: 15px; padding: 10px; border: 1px solid #bbb; border-radius: 6px; }
  button.btn { border: 0; cursor: pointer; }
  ol li { margin-bottom: 8px; }
  .note { color: #555; font-size: 14px; }
</style>
</head>
<body>
<h1>記録するスプレッドシートの登録</h1>
<div id="main">
<ol>
  <li><a href="https://sheets.new" target="_blank" rel="noopener">ここを押して、新しいスプレッドシートを作ります</a>（YouTubeを運営しているアカウントでも、ふだん使いのアカウントでも構いません）。名前は「YouTube記録」などにしておくと分かりやすいです</li>
  <li>右上の「共有」を押し、<b>tanakaod.info@gmail.com</b> を「<b>編集者</b>」で追加して「送信」を押します。記録を書き込むために必要です</li>
  <li>スプレッドシートのアドレス（URL）をコピーして、下に貼り付けます</li>
</ol>
<p><input id="url" placeholder="https://docs.google.com/spreadsheets/d/..." autocomplete="off"></p>
<p><button class="btn" id="go">登録する</button></p>
<p id="msg"></p>
</div>
<script>
  var key = new URLSearchParams(location.search).get('key') || '';
  var msg = document.getElementById('msg');
  var go = document.getElementById('go');
  if (!/^ytk-[0-9a-f]{20}$/.test(key)) {
    document.getElementById('main').innerHTML = '<p>このリンクは使えません。担当者から受け取ったリンクから始めてください。</p>';
  }
  go.onclick = function () {
    var url = document.getElementById('url').value.trim();
    if (!/docs\.google\.com\/spreadsheets\/d\//.test(url)) { msg.textContent = 'スプレッドシートのURL（https://docs.google.com/spreadsheets/d/… で始まるもの）を貼ってください。'; return; }
    go.disabled = true;
    msg.textContent = '登録して、これまでの数字を取り込んでいます。1〜3分かかります。このままお待ちください…';
    fetch('https://script.google.com/macros/s/AKfycbwQY7jCnHLJxWXFYtVxx8_DqrKZT-c7tAriPBzJBoPLDC5gGSmx2KHVmqPcBuFqFJ_a/exec?action=sheet&key=' + encodeURIComponent(key) + '&url=' + encodeURIComponent(url), { credentials: 'omit' })
      .then(function (r) { return r.json(); })
      .then(function (j) { msg.textContent = j.message || (j.ok ? '登録しました。' : '登録に失敗しました。'); go.disabled = !!j.ok; })
      .catch(function () { msg.textContent = '通信に失敗しました。少し待ってから、もう一度「登録する」を押してください。'; go.disabled = false; });
  };
</script>
</body>
</html>
